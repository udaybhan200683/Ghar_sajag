name: GS-177 branded Android caregiver APK build

on:
  workflow_dispatch:
    inputs:
      backend_origin:
        description: Exact HTTPS origin (private IPv4 or single-label .local is accepted only with GS-179 LAN TEST_ONLY enabled)
        required: false
        type: string
      gs179_local_lan_test_only:
        description: Build a debug-only APK for the owner-authorized local GS-179 server
        required: false
        default: false
        type: boolean
  push:
    branches:
      - feature/gs-177-caregiver-android
      - feature/r1-commercial-baseline
    paths:
      - '.github/workflows/gs177-android-dashboard-apk.yml'
      - 'code/Makefile'
      - 'code/parivar_saathi_android_app/**'
      - 'code/tools/performance/profile_pwa.py'
      - 'code/tools/sim/local_lab.py'
      - 'code/tools/sim/pwa/**'
      - 'code/tests/**'
      - 'code/validation/**'

permissions:
  contents: read

concurrency:
  group: gs177-android-dashboard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-caregiver-apk:
    # The fixed origin is the owner-verified, isolated TEST_ONLY free staging service.
    # Repository variable overrides it for future approved environments; neither is a secret.
    # This workflow builds the Connected Lite APK from its maintained source branch;
    # it is not a release pipeline and does not qualify physical phone behavior.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GS177_BACKEND_ORIGIN: ${{ inputs.backend_origin || vars.GS177_BACKEND_ORIGIN || 'https://parivar-saathi-lite-staging.onrender.com' }}
      GS177_LOCAL_LAN_TEST_ONLY: ${{ inputs.gs179_local_lan_test_only && '1' || '0' }}
      GS177_KEYSTORE_B64: ${{ secrets.GS177_KEYSTORE_B64 }}
      GS177_KEYSTORE_PASSWORD: ${{ secrets.GS177_KEYSTORE_PASSWORD }}
      GS177_KEY_ALIAS: ${{ secrets.GS177_KEY_ALIAS }}
      GS177_KEY_PASSWORD: ${{ secrets.GS177_KEY_PASSWORD }}
    permissions:
      contents: read
    steps:
      - name: Checkout Parivar Saathi Connected Lite source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Prepare owner-controlled pilot signing key when supplied
        if: env.GS177_LOCAL_LAN_TEST_ONLY != '1' && env.GS177_KEYSTORE_B64 != ''
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$GS177_KEYSTORE_B64" ]]; then
            : "${GS177_KEYSTORE_PASSWORD:?missing pilot keystore password}"
            : "${GS177_KEY_ALIAS:?missing pilot key alias}"
            : "${GS177_KEY_PASSWORD:?missing pilot key password}"
            key_path="$RUNNER_TEMP/gs177-pilot.jks"
            printf '%s' "$GS177_KEYSTORE_B64" | base64 -d > "$key_path"
            chmod 600 "$key_path"
            printf 'GS177_KEYSTORE_PATH=%s\n' "$key_path" >> "$GITHUB_ENV"
          fi

      - name: Install pinned Python browser-test dependency
        shell: bash
        run: python3 -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/gs177-python-deps" websocket-client==1.8.0

      - name: Run PWA browser and offline startup regression
        working-directory: code
        env:
          PYTHONPATH: ${{ runner.temp }}/gs177-python-deps
        run: make pwa-68-browser-test

      - name: Run GS-116 registered caregiver app and Android stages
        working-directory: code
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: python3 validation/component_gate.py --suite caregiver-app

      - name: Verify APK signature and write artifact evidence
        shell: bash
        env:
          ANDROID_SOURCE_REVISION: ${{ github.sha }}
          ANDROID_SOURCE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          apk_source='code/parivar_saathi_android_app/android/app/build/outputs/apk/debug/app-debug.apk'
          apk_dir="$RUNNER_TEMP/gs177-apk"
          mkdir -p "$apk_dir"
          cp "$apk_source" "$apk_dir/parivar-saathi-caregiver-debug.apk"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk_dir/parivar-saathi-caregiver-debug.apk"
          (
            cd "$apk_dir"
            sha256sum parivar-saathi-caregiver-debug.apk > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          {
            printf 'source_revision=%s\n' "$ANDROID_SOURCE_REVISION"
            printf 'source_ref=%s\n' "$ANDROID_SOURCE_REF"
            printf 'package_name=in.gharsajag.caregiver\n'
            printf 'version_name=0.4.0-connected-lite-staging\n'
            printf 'gradle=8.9\njava=17\nandroid_compile_sdk=35\n'
            printf 'backend_origin=%s\n' "$GS177_BACKEND_ORIGIN"
            printf 'gs179_local_lan_test_only=%s\n' "$GS177_LOCAL_LAN_TEST_ONLY"
            if [[ "$GS177_LOCAL_LAN_TEST_ONLY" == '1' ]]; then
              printf 'lan_test_ca_sha256=%s\n' "$(sha256sum code/parivar_saathi_android_app/android/app/src/gs179LocalLan/res/raw/gs179_local_lan_test_ca.pem | awk '{print $1}')"
            fi
            printf 'backend_build_properties=caregiverDebugBackendOrigin|caregiverReleaseBackendOrigin\n'
            printf 'approved_logo_sha256=d0ff244d61b5cb047c320fc3af1028fa8e780186189a481657b8fea14b679441\n'
            printf 'bundled_ui=existing-tools/sim/pwa\n'
            printf 'push_notifications=disabled\nvoice_calling=disabled\n'
            if [[ "$GS177_LOCAL_LAN_TEST_ONLY" == '1' ]]; then
              printf 'signing=runner-generated-debug-key; local-lan-test-only\n'
            elif [[ -n "${GS177_KEYSTORE_PATH:-}" ]]; then
              printf 'signing=owner-controlled-pilot-key\n'
            else
              printf 'signing=runner-generated-debug-key; testing-only; uninstall-previous-may-be-required\n'
            fi
          } > "$apk_dir/build-info.txt"

      - name: Upload APK and SHA-256 evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: parivar-saathi-caregiver-debug-${{ github.sha }}
          path: ${{ runner.temp }}/gs177-apk/
          if-no-files-found: error
          retention-days: 14

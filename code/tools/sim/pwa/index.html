<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f5fbf7" />
  <meta name="description" content="Parivar Saathi caregiver app. Safer homes, happier families." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/parivar-saathi-icon-192.png" type="image/png" sizes="192x192" />
  <link rel="stylesheet" href="styles.css" />
  <title>Parivar Saathi</title>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <img src="assets/parivar-saathi-icon-192.png" alt="" class="brand-icon">
      <div>
        <div class="brand-name">Parivar Saathi</div>
        <div class="tagline">Safer homes • Happier families</div>
      </div>
    </div>
    <label class="away-wrap">
      <input id="awayToggle" type="checkbox" disabled aria-disabled="true" />
      <span class="switch"></span>
      <span>Away <small style="opacity:.65">(coming later)</small></span>
    </label>
    <div class="datetime">
      <div id="dateText"></div>
      <strong id="timeText"></strong>
    </div>
  </header>

  <div id="connectionStatus" class="connection-status" role="status" aria-live="polite" hidden></div>
  <main>
    <section id="homeTab" class="tab-panel active"></section>
    <section id="devicesTab" class="tab-panel"></section>
    <section id="reportsTab" class="tab-panel"></section>
    <section id="settingsTab" class="tab-panel"></section>
  </main>

  <nav class="bottom-nav" aria-label="Primary" hidden>
    <button data-tab="home" class="nav-btn active"><span>⌂</span><b>Home</b></button>
    <button data-tab="devices" class="nav-btn"><span>◉</span><b>Devices</b></button>
    <button data-tab="reports" class="nav-btn"><span>▤</span><b>Reports</b></button>
    <button data-tab="settings" class="nav-btn"><span>⚙</span><b>Settings</b></button>
  </nav>
</div>
<dialog id="phase1Dialog" aria-label="Application settings and device details"></dialog>
<script src="runtime-config.js"></script>
<script type="module" src="boot.mjs"></script>
</body>
</html>

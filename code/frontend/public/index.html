<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0b5d4b" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Ghar Sajag Caregiver Prototype</title>
  </head>
  <body>
    <main>
      <header><p class="eyebrow">Ghar Sajag</p><h1>Parents' home</h1><p id="updated">Loading household status…</p></header>
      <section id="connectivity" class="card"></section>
      <section id="activity" class="card"></section>
      <section class="card"><h2>Sensor connection</h2><div id="node-health"></div></section>
      <section id="door" class="card"></section>
      <section class="card"><h2>Action needed</h2><div id="incidents"></div></section>
      <section class="card"><h2>Recent activity</h2><ol id="timeline" aria-live="polite"></ol></section>
      <section class="card"><h2>Important distinction</h2><p>Activity evidence, sensor coverage and family acknowledgement are shown separately. No card makes a medical or wellbeing claim.</p></section>
    </main>
    <script type="module" src="./app.mjs"></script>
  </body>
</html>

groups:
  - name: ghar-sajag-pilot
    rules:
      - alert: EventIngestFailures
        expr: rate(ghar_sajag_ingest_failures_total[5m]) > 0
        for: 5m
      - alert: NotificationWorkerBacklog
        expr: ghar_sajag_notification_oldest_job_seconds > 120
        for: 5m
      - alert: FleetHeartbeatDrop
        expr: rate(ghar_sajag_hub_heartbeats_total[15m]) < 0.5 * rate(ghar_sajag_hub_heartbeats_total[1h])
        for: 10m
      - alert: BackupFailure
        expr: ghar_sajag_last_successful_backup_age_seconds > 90000
        for: 15m

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#35536d"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="40" y="40" font-family="DejaVu Sans" font-size="27" fill="#17324d">H09 interaction controller | implemented class boundary</text><rect x="40" y="90" width="710" height="365" rx="9" fill="#edf5fa" stroke="#52738d" stroke-width="2"/><text x="58" y="122" font-family="DejaVu Sans" font-size="24" fill="#17324d">Controller</text><text x="58" y="154" font-family="DejaVu Sans" font-size="19" fill="#17324d">- provider_: Provider&amp; (borrowed)</text><text x="58" y="182" font-family="DejaVu Sans" font-size="19" fill="#17324d">- state_: Idle | Waiting | Ready | Failed</text><text x="58" y="210" font-family="DejaVu Sans" font-size="19" fill="#17324d">- id_, started_: uint64_t</text><text x="58" y="238" font-family="DejaVu Sans" font-size="19" fill="#17324d">+ begin(now, consent, online): Result</text><text x="58" y="266" font-family="DejaVu Sans" font-size="19" fill="#17324d">+ complete(id, success): bool</text><text x="58" y="294" font-family="DejaVu Sans" font-size="19" fill="#17324d">+ tick(now); cancel(); state(); id()</text><text x="58" y="322" font-family="DejaVu Sans" font-size="19" fill="#17324d">+ timeout_ms = 30000</text><rect x="840" y="90" width="500" height="175" rx="9" fill="#edf5fa" stroke="#52738d" stroke-width="2"/><text x="858" y="122" font-family="DejaVu Sans" font-size="24" fill="#17324d">&lt;&lt;interface&gt;&gt; Provider</text><text x="858" y="154" font-family="DejaVu Sans" font-size="19" fill="#17324d">+ start(id): bool noexcept</text><text x="858" y="182" font-family="DejaVu Sans" font-size="19" fill="#17324d">+ cancel(id): void noexcept</text><text x="858" y="210" font-family="DejaVu Sans" font-size="19" fill="#17324d">Nonblocking; no reentry</text><line x1="750" y1="160" x2="840" y2="160" stroke="#35536d" stroke-width="2" marker-end="url(#a)"/><text x="758" y="152.0" font-family="DejaVu Sans" font-size="17" fill="#17324d"></text><rect x="840" y="345" width="500" height="150" rx="9" fill="#edf5fa" stroke="#52738d" stroke-width="2"/><text x="858" y="377" font-family="DejaVu Sans" font-size="24" fill="#17324d">Fake provider (tests)</text><text x="858" y="409" font-family="DejaVu Sans" font-size="19" fill="#17324d">Implements Provider</text><text x="858" y="437" font-family="DejaVu Sans" font-size="19" fill="#17324d">Counters and start-failure injection</text><line x1="1080" y1="345" x2="1080" y2="265" stroke="#35536d" stroke-width="2" marker-end="url(#a)"/><text x="1088" y="297.0" font-family="DejaVu Sans" font-size="17" fill="#17324d">implements</text><rect x="40" y="550" width="710" height="145" rx="9" fill="#edf5fa" stroke="#52738d" stroke-width="2"/><text x="58" y="582" font-family="DejaVu Sans" font-size="24" fill="#17324d">S04 Product</text><text x="58" y="614" font-family="DejaVu Sans" font-size="19" fill="#17324d">+ ai: compile-time bool</text><text x="58" y="642" font-family="DejaVu Sans" font-size="19" fill="#17324d">+ name, version: compile-time strings</text><line x1="230" y1="455" x2="230" y2="550" stroke="#35536d" stroke-width="2" marker-end="url(#a)"/><text x="238" y="494.5" font-family="DejaVu Sans" font-size="17" fill="#17324d">uses</text><text x="40" y="770" font-family="DejaVu Sans" font-size="23" fill="#17324d">Ownership: one caller task; provider outlives controller.</text><text x="40" y="815" font-family="DejaVu Sans" font-size="23" fill="#17324d">No transcript, payload buffer, thread or heap allocation in Controller.</text></svg>
services:
  - type: web
    name: parivar-saathi-lite-staging
    runtime: python
    plan: free
    branch: feature/r1-commercial-baseline
    autoDeploy: false
    buildCommand: pip install -r code/parivar_saathi_android_app/server/requirements.txt && make -C code lab-build
    startCommand: cd code/parivar_saathi_android_app/server && gunicorn --workers 2 --threads 2 --timeout 90 --bind 0.0.0.0:$PORT wsgi:application
    healthCheckPath: /readyz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: DATABASE_URL
        fromDatabase:
          name: parivar-saathi-lite-db
          property: connectionString
      - key: PUBLIC_ORIGIN
        fromService:
          name: parivar-saathi-lite-staging
          type: web
          envVarKey: RENDER_EXTERNAL_URL
databases:
  - name: parivar-saathi-lite-db
    plan: free
    ipAllowList: []
